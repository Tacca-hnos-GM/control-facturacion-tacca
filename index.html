<!-- =========================================================
     CONFIGURACIÓN E INICIALIZACIÓN DE FIREBASE
     Completar firebaseConfig con los datos de tu proyecto
     (ver "Guía 1" al final de este documento).
     Si firebaseConfig.apiKey queda vacío, la app funciona en
     MODO DEMO con datos de prueba en memoria (no persiste).
========================================================= -->
<script>
(async () => {
  // Usamos import() dinámico (en vez de "type=module" + import estático):
  // evita cualquier dependencia de que el navegador (o alguna herramienta
  // de hosting/preview) preserve el atributo type="module" en este script.
  // Funciona igual, pero es más portable.
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const {
    getFirestore, collection, doc, getDocs, addDoc, updateDoc, deleteDoc,
    onSnapshot, query, orderBy, serverTimestamp, setDoc
  } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
  const {
    getStorage, ref, uploadBytes, getDownloadURL
  } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js");

  // Credenciales del proyecto Firebase (gestion-rrhh-tacca)
  const firebaseConfig = {
    apiKey: "AIzaSyB77YN1JDHDTBkoukdsU1TnQQyIktpIzv0",
    authDomain: "gestion-rrhh-tacca.firebaseapp.com",
    projectId: "gestion-rrhh-tacca",
    storageBucket: "gestion-rrhh-tacca.firebasestorage.app",
    messagingSenderId: "453983143887",
    appId: "1:453983143887:web:4f74e780deff1db03b34ba"
  };

  const DEMO_MODE = !firebaseConfig.apiKey;
  window.__TACCA_DEMO_MODE__ = DEMO_MODE;

  let app, db, auth, storage;
  if (!DEMO_MODE) {
    app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    auth = getAuth(app);
    storage = getStorage(app);
  }

  // ---- Almacén en memoria para MODO DEMO (se reinicia al recargar) ----
  window.__demoStore__ = window.__demoStore__ || {};

  function demoCollection(name) {
    if (!window.__demoStore__[name]) window.__demoStore__[name] = [];
    return window.__demoStore__[name];
  }

  // API unificada que usa el resto de la app (funciona igual en demo o real)
  window.dbHelpers = {
    isDemo: DEMO_MODE,

    async listAll(colName) {
      if (DEMO_MODE) return demoCollection(colName).slice();
      const snap = await getDocs(collection(db, colName));
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    },

    async addItem(colName, data) {
      if (DEMO_MODE) {
        const id = colName + "_" + Math.random().toString(36).slice(2, 10);
        const item = { id, ...data, _createdAt: Date.now() };
        demoCollection(colName).push(item);
        return item;
      }
      const docRef = await addDoc(collection(db, colName), { ...data, _createdAt: serverTimestamp() });
      return { id: docRef.id, ...data };
    },

    async setItem(colName, id, data) {
      if (DEMO_MODE) {
        const arr = demoCollection(colName);
        const idx = arr.findIndex(i => i.id === id);
        if (idx >= 0) arr[idx] = { ...arr[idx], ...data };
        else arr.push({ id, ...data });
        return { id, ...data };
      }
      await setDoc(doc(db, colName, id), data, { merge: true });
      return { id, ...data };
    },

    async updateItem(colName, id, patch) {
      if (DEMO_MODE) {
        const arr = demoCollection(colName);
        const idx = arr.findIndex(i => i.id === id);
        if (idx >= 0) arr[idx] = { ...arr[idx], ...patch };
        return arr[idx];
      }
      await updateDoc(doc(db, colName, id), patch);
      return { id, ...patch };
    },

    async removeItem(colName, id) {
      if (DEMO_MODE) {
        const arr = demoCollection(colName);
        const idx = arr.findIndex(i => i.id === id);
        if (idx >= 0) arr.splice(idx, 1);
        return true;
      }
      await deleteDoc(doc(db, colName, id));
      return true;
    },

    async uploadFile(path, file) {
      if (DEMO_MODE) {
        // En demo simplemente devolvemos una URL local temporal (no persiste)
        return URL.createObjectURL(file);
      }
      const fileRef = ref(storage, path);
      await uploadBytes(fileRef, file);
      return await getDownloadURL(fileRef);
    },

    async login(email, password) {
      if (DEMO_MODE) {
        if (email && password) return { uid: "demo-user", email };
        throw new Error("Completá usuario y contraseña.");
      }
      const cred = await signInWithEmailAndPassword(auth, email, password);
      return cred.user;
    },

    async logout() {
      if (DEMO_MODE) return true;
      return signOut(auth);
    },

    onAuth(cb) {
      if (DEMO_MODE) {
        // En demo arrancamos "sin sesión" para mostrar la pantalla de login
        cb(null);
        return () => {};
      }
      return onAuthStateChanged(auth, cb);
    }
  };

  // Avisamos a React que ya puede arrancar
  window.dispatchEvent(new Event("tacca-firebase-ready"));
})();
</script>

<script>

} = React;
function normalizar(str) {
  return (str || "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}
function fuzzyScore(query, target) {
  const q = normalizar(query);
  const t = normalizar(target);
  if (!q) return 0;
  if (t.includes(q)) return 100 - (t.length - q.length) * 0.2;
  let qi = 0;
  let score = 0;
  let lastMatch = -1;
  for (let ti = 0; ti < t.length && qi < q.length; ti++) {
    if (t[ti] === q[qi]) {
      score += lastMatch === ti - 1 ? 3 : 1;
      lastMatch = ti;
      qi++;
    }
  }
  if (qi < q.length) return -1;
  return score;
}
function fechaCorta(iso) {
  if (!iso) return "-";
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("es-AR", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"

}

  const d1 = new Date(iso1 + "T00:00:00");
  const d2 = new Date(iso2 + "T00:00:00");

function useDebounced(value, delay) {
  const [v, setV] = useState(value);
  useEffect(() => {
    const t = setTimeout(() => setV(value), delay);
    return () => clearTimeout(t);
  }, [value, delay]);
  return v;
}
function csvDescargar(nombreArchivo, filas) {
  const csv = filas.map(f => f.map(c => `"${(c ?? "").toString().replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF" + csv], {
    type: "text/csv;charset=utf-8;"
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nombreArchivo;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function Icon({
  name,
  size = 18,
  className = ""
}) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const el = document.createElement("i");
      el.setAttribute("data-lucide", name);
      ref.current.appendChild(el);
      window.lucide.createIcons({
        nameAttr: "data-lucide",
        context: ref.current
      });
    }
  }, [name]);
  return React.createElement("span", {
    ref: ref,
    className: cn("inline-flex items-center justify-center", className),
    style: {
      width: size,
      height: size
    }
  });
}
